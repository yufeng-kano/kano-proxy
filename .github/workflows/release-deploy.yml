# Deploy Worker + Pages to Cloudflare when a GitHub Release is published.
# Versioning policy: see .rule (default SemVer minor bump → x.(y+1).0).
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — Account API token (Workers/Pages/D1/KV edit)
#   CLOUDFLARE_ACCOUNT_ID
#   CF_D1_DATABASE_ID
#   CF_KV_BENCH_ID
#   CF_KV_CACHE_ID
# Required repository variable (public):
#   APP_URL                — e.g. https://kano-proxy.example.com
# Optional repository variable:
#   CODEX_RELAY_URL        — codex egress relay origin (docs/codex-relay.md);
#                            empty/unset omits the var (relay off)
# Worker app secrets (GOOGLE_*, SESSION_SECRET, TOKEN_ENCRYPTION_KEY) stay in
# Cloudflare via `wrangler secret put` and are not re-uploaded here.

name: Release deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: the commit that triggered the run)"
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check release tag shape (published releases only)
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Expect vMAJOR.MINOR.PATCH (optional leading v)
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be SemVer like v1.2.0 (got: $TAG)"
            exit 1
          fi
          echo "Deploying release tag: $TAG"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler 4 requires Node.js >= 22
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web
        run: pnpm --filter web build

      - name: Require deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_KV_BENCH_ID: ${{ secrets.CF_KV_BENCH_ID }}
          CF_KV_CACHE_ID: ${{ secrets.CF_KV_CACHE_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_D1_DATABASE_ID CF_KV_BENCH_ID CF_KV_CACHE_ID APP_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required config: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set repository secrets/vars listed in docs/deployment.md (CI / GitHub Actions)."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *)
              echo "APP_URL must be an https:// origin (got: $APP_URL)"
              exit 1
              ;;
          esac

      - name: Write production wrangler config
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_KV_BENCH_ID: ${{ secrets.CF_KV_BENCH_ID }}
          CF_KV_CACHE_ID: ${{ secrets.CF_KV_CACHE_ID }}
          APP_URL: ${{ vars.APP_URL }}
          CODEX_RELAY_URL: ${{ vars.CODEX_RELAY_URL }}
        run: python3 scripts/ci/write-production-wrangler.py
      - name: Migrate D1 (remote)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply kano-proxy --remote --config wrangler.production.toml

      - name: Deploy Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.production.toml

      - name: Deploy Pages
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --branch must match the Pages project's production branch: release
        # events check out a tag (detached HEAD), so without it wrangler infers
        # branch "HEAD" and the upload lands as a Preview deployment instead of
        # Production.
        run: pnpm exec wrangler pages deploy ../web/dist --project-name=kano-proxy --branch=main --commit-dirty=true
