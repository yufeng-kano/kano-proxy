# Kept as a disabled workflow so existing links explain the migration.
# Official hosting is deployed by the private kano-proxy-cloud repository.
# Verification remains in ci.yml; CLI distribution remains in cli-release.yml.
name: Production deployment retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Production deployment moved to kano-proxy-cloud.'
