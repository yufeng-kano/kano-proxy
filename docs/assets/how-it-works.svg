<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%" height="100%" role="img" aria-label="How Kano Proxy works">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker id="arrowIn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F46E5" />
    </marker>
    <marker id="arrowOut" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowTunnel" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0891B2" />
    </marker>
  </defs>

  <style>
    .h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 700; fill: #0F172A; }
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; }
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 11px; fill: #64748B; }
    .c { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #334155; }
    .l { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; }
  </style>

  <!-- Canvas -->
  <rect width="960" height="470" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- ==================== LEFT: CLIENTS ==================== -->
  <g transform="translate(36, 40)" filter="url(#shadow)">
    <rect width="220" height="300" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="110" y="30" text-anchor="middle" class="h">Clients &amp; coding agents</text>

    <g transform="translate(16, 48)">
      <rect width="188" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <circle cx="18" cy="18" r="5" fill="#0EA5E9" />
      <text x="32" y="22" class="t">Claude Code · Codex CLI</text>

      <rect y="44" width="188" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <circle cx="18" cy="62" r="5" fill="#8B5CF6" />
      <text x="32" y="66" class="t">Cursor · Cline · Roo · Aider</text>

      <rect y="88" width="188" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <circle cx="18" cy="106" r="5" fill="#10B981" />
      <text x="32" y="110" class="t">OpenAI / Anthropic SDKs</text>

      <!-- Bases -->
      <g transform="translate(0, 140)">
        <rect width="188" height="96" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="12" y="20" class="l" fill="#94A3B8">BASE URLS</text>
        <text x="12" y="40" class="c" fill="#4F46E5">/openai/v1</text>
        <text x="12" y="56" class="c" fill="#4F46E5">/anthropic</text>
        <text x="12" y="72" class="c" fill="#4F46E5">/g/&lt;group&gt;/…</text>
        <text x="12" y="88" class="s">Authorization: Bearer sk-kano-proxy-…</text>
      </g>
    </g>
  </g>

  <!-- ==================== CENTER: KANO PROXY ==================== -->
  <g transform="translate(330, 24)" filter="url(#shadow)">
    <rect width="300" height="380" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" />

    <!-- Header -->
    <rect x="18" y="16" width="264" height="34" rx="8" fill="#EEF2FF" />
    <text x="150" y="38" text-anchor="middle" class="h" fill="#3730A3">Kano Proxy</text>
    <text x="150" y="68" text-anchor="middle" class="s">Rust server · PostgreSQL · docker compose</text>

    <!-- Stages -->
    <g transform="translate(18, 82)">
      <rect width="264" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="20" class="t">1 · Tenant auth</text>
      <text x="14" y="36" class="s">Google sign-in · API keys · per-user pools</text>

      <rect y="54" width="264" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="74" class="t">2 · Protocol adapter</text>
      <text x="14" y="90" class="s">OpenAI and Anthropic wire, both directions</text>

      <rect y="108" width="264" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="128" class="t" fill="#B45309">3 · Routing &amp; failover</text>
      <text x="14" y="144" class="s">Account pools · model groups · 429 bench</text>

      <rect y="162" width="264" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="182" class="t" fill="#047857">4 · Streaming relay</text>
      <text x="14" y="198" class="s">SSE passthrough, no buffering · cancellation</text>

      <!-- Footer -->
      <rect y="220" width="264" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-dasharray="3 3" />
      <text x="132" y="240" text-anchor="middle" class="s" fill="#475569">Web UI: usage windows · keys · groups · logs</text>
      <text x="132" y="258" text-anchor="middle" class="s" fill="#475569">Prompts and completions are never stored</text>
    </g>
  </g>

  <!-- ==================== RIGHT: UPSTREAMS ==================== -->
  <g transform="translate(704, 40)" filter="url(#shadow)">
    <rect width="220" height="222" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="110" y="30" text-anchor="middle" class="h">Your subscriptions</text>

    <g transform="translate(16, 46)">
      <rect width="188" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="8" y="8" width="14" height="14" rx="4" fill="#D97706" />
      <text x="30" y="20" class="c">Claude Code (Pro / Team)</text>

      <rect y="36" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="8" y="44" width="14" height="14" rx="4" fill="#00A67E" />
      <text x="30" y="56" class="c">ChatGPT Codex</text>

      <rect y="72" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="8" y="80" width="14" height="14" rx="4" fill="#0F172A" />
      <text x="30" y="92" class="c">xAI SuperGrok</text>

      <rect y="108" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="8" y="116" width="14" height="14" rx="4" fill="#3B82F6" />
      <text x="30" y="128" class="c">Google Antigravity</text>

      <rect y="144" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="8" y="152" width="14" height="14" rx="4" fill="#6366F1" />
      <text x="30" y="164" class="c">Custom endpoint (BYO API)</text>
    </g>
  </g>

  <!-- ==================== RIGHT BOTTOM: LOCAL LLMs ==================== -->
  <g transform="translate(704, 284)" filter="url(#shadow)">
    <rect width="220" height="120" rx="12" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5" />
    <text x="110" y="28" text-anchor="middle" class="h" fill="#155E75">Your machine</text>
    <g transform="translate(16, 42)">
      <rect width="188" height="30" rx="6" fill="#FFFFFF" stroke="#A5F3FC" />
      <text x="94" y="20" text-anchor="middle" class="c" fill="#0E7490">kano-proxy CLI</text>
      <text x="94" y="52" text-anchor="middle" class="s" fill="#155E75">Ollama · LM Studio · vLLM · llama.cpp</text>
      <text x="94" y="68" text-anchor="middle" class="s" fill="#155E75">no public URL, no port forwarding</text>
    </g>
  </g>

  <!-- ==================== ARROWS ==================== -->
  <!-- Client -> Proxy -->
  <path d="M 256 140 L 322 140" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowIn)" />
  <text x="289" y="130" text-anchor="middle" class="l" fill="#4F46E5">API key</text>

  <!-- Proxy -> Upstreams -->
  <path d="M 630 140 L 696 140" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowIn)" />
  <text x="663" y="130" text-anchor="middle" class="l" fill="#4F46E5">OAuth</text>

  <!-- Upstreams -> Proxy -> Client (stream) -->
  <path d="M 696 220 L 630 220" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowOut)" />
  <path d="M 322 220 L 256 220" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowOut)" />
  <text x="289" y="238" text-anchor="middle" class="l" fill="#059669">SSE stream</text>

  <!-- CLI tunnel: outbound dial from the machine to the proxy -->
  <path d="M 704 344 L 630 344" fill="none" stroke="#0891B2" stroke-width="2" marker-end="url(#arrowTunnel)" marker-start="url(#arrowTunnel)" />
  <text x="667" y="334" text-anchor="middle" class="l" fill="#0891B2">WebSocket</text>

  <!-- Caption -->
  <text x="480" y="446" text-anchor="middle" class="s">Credentials stay on the server. Clients only ever hold a Kano API key; every bound provider answers on both API formats.</text>
</svg>
