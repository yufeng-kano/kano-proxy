<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 600" width="1152" height="600" role="img" aria-label="Kano Proxy 運作架構">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker id="arrowIn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4F46E5" />
    </marker>
    <marker id="arrowOut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowTunnel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0891B2" />
    </marker>
  </defs>

  <style>
    .h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 21px; font-weight: 700; fill: #0F172A; }
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 17px; font-weight: 600; fill: #1E293B; }
    .r { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 16px; font-weight: 500; fill: #1E293B; }
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 16px; fill: #64748B; }
    .c { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #334155; }
    .l { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 14px; font-weight: 700; }
  </style>

  <!-- Canvas -->
  <rect x="0.75" y="0.75" width="1150.5" height="598.5" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- ==================== LEFT: HOW YOU USE IT ==================== -->
  <g transform="translate(28, 36)" filter="url(#shadow)">
    <rect width="290" height="490" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <text x="145" y="36" text-anchor="middle" class="h">使用方式</text>
    <g transform="translate(16, 56)">
      <rect width="258" height="112" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <circle cx="22" cy="26" r="6" fill="#0EA5E9" />
      <text x="38" y="32" class="t">用 CLI 使用</text>
      <text x="18" y="64" class="c">kano-proxy agent launch</text>
      <text x="18" y="92" class="s">Claude Code、Codex CLI</text>
    </g>
    <g transform="translate(16, 180)">
      <rect width="258" height="112" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <circle cx="22" cy="26" r="6" fill="#8B5CF6" />
      <text x="38" y="32" class="t">呼叫 API</text>
      <text x="18" y="64" class="s">Cursor、Cline、OpenCode</text>
      <text x="18" y="92" class="s">OpenAI / Anthropic SDK</text>
    </g>
    <g transform="translate(16, 304)">
      <rect width="258" height="166" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="18" y="30" class="l" fill="#64748B">BASE URL</text>
      <text x="18" y="58" class="c">/openai/v1</text>
      <text x="18" y="82" class="c">/anthropic</text>
      <text x="18" y="106" class="c">/g/&lt;group&gt;/…</text>
      <line x1="18" y1="122" x2="240" y2="122" stroke="#E2E8F0" />
      <text x="18" y="148" class="c">sk-kano-proxy-…</text>
      <text x="242" y="148" text-anchor="end" class="l" fill="#64748B">KEY</text>
    </g>
  </g>

  <!-- ==================== CENTRE: KANO PROXY ==================== -->
  <g transform="translate(422, 20)" filter="url(#shadow)">
    <rect width="308" height="506" rx="18" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2.5" />
    <rect x="16" y="16" width="276" height="46" rx="10" fill="#EEF2FF" />
    <text x="154" y="46" text-anchor="middle" class="h">Kano Proxy</text>
    <text x="154" y="86" text-anchor="middle" class="s">Rust 伺服器 · PostgreSQL</text>
    <g transform="translate(16, 102)">
      <rect width="276" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="16" y="31" class="t">1 · 登入與 key</text>
      <text x="16" y="55" class="s">Google 登入 · API key</text>
    </g>
    <g transform="translate(16, 182)">
      <rect width="276" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="16" y="31" class="t">2 · 協定雙向轉換</text>
      <text x="16" y="55" class="s">OpenAI 與 Anthropic API</text>
    </g>
    <g transform="translate(16, 262)">
      <rect width="276" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="16" y="31" class="t">3 · 路由與容錯移轉</text>
      <text x="16" y="55" class="s">多帳號 · 模型群組</text>
    </g>
    <g transform="translate(16, 342)">
      <rect width="276" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="16" y="31" class="t">4 · 串流</text>
      <text x="16" y="55" class="s">不緩衝 · 可中途取消</text>
    </g>
    <g transform="translate(16, 422)">
      <rect width="276" height="68" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 4" />
      <text x="138" y="28" text-anchor="middle" class="s">Web UI：用量、key、請求紀錄</text>
      <text x="138" y="52" text-anchor="middle" class="s">提示詞與回應都不記錄</text>
    </g>
  </g>

  <!-- ==================== RIGHT: YOUR ACCOUNTS ==================== -->
  <g transform="translate(834, 36)" filter="url(#shadow)">
    <rect width="290" height="306" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="145" y="36" text-anchor="middle" class="h">你的帳號</text>
    <g transform="translate(16, 56)">
      <rect width="258" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="14" y="13" width="16" height="16" rx="4" fill="#D97706" />
      <text x="42" y="27" class="r">Claude 訂閱</text>
    </g>
    <g transform="translate(16, 104)">
      <rect width="258" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="14" y="13" width="16" height="16" rx="4" fill="#10A37F" />
      <text x="42" y="27" class="r">ChatGPT Codex</text>
    </g>
    <g transform="translate(16, 152)">
      <rect width="258" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="14" y="13" width="16" height="16" rx="4" fill="#0F172A" />
      <text x="42" y="27" class="r">xAI SuperGrok</text>
    </g>
    <g transform="translate(16, 200)">
      <rect width="258" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="14" y="13" width="16" height="16" rx="4" fill="#4285F4" />
      <text x="42" y="27" class="r">Google AI Pro / Ultra</text>
    </g>
    <g transform="translate(16, 248)">
      <rect width="258" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="14" y="13" width="16" height="16" rx="4" fill="#6366F1" />
      <text x="42" y="27" class="r">自訂端點</text>
    </g>
  </g>

  <!-- ==================== RIGHT: YOUR MACHINE ==================== -->
  <g transform="translate(834, 358)" filter="url(#shadow)">
    <rect width="290" height="168" rx="14" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5" />
    <text x="145" y="32" text-anchor="middle" class="h">你的電腦</text>
    <rect x="16" y="46" width="258" height="38" rx="8" fill="#FFFFFF" stroke="#A5F3FC" />
    <text x="145" y="71" text-anchor="middle" class="c">kano-proxy tunnel</text>
    <text x="145" y="106" text-anchor="middle" class="s">Ollama、LM Studio</text>
    <text x="145" y="128" text-anchor="middle" class="s">vLLM、llama.cpp</text>
    <text x="145" y="150" text-anchor="middle" class="s">不需公開網址</text>
  </g>

  <!-- ==================== ARROWS ==================== -->
  <path d="M 324 160 L 414 160" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowIn)" />
  <text x="370" y="148" text-anchor="middle" class="l" fill="#4F46E5">API key</text>
  <path d="M 416 262 L 326 262" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowOut)" />
  <text x="370" y="284" text-anchor="middle" class="l" fill="#059669">串流</text>
  <path d="M 736 160 L 826 160" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowIn)" />
  <text x="782" y="148" text-anchor="middle" class="l" fill="#4F46E5">請求</text>
  <path d="M 828 262 L 738 262" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowOut)" />
  <text x="782" y="284" text-anchor="middle" class="l" fill="#059669">串流</text>
  <path d="M 738 423 L 826 423" stroke="#0891B2" stroke-width="2" marker-start="url(#arrowTunnel)" marker-end="url(#arrowTunnel)" />
  <text x="782" y="411" text-anchor="middle" class="l" fill="#0891B2">WebSocket</text>

  <!-- Caption -->
  <text x="576" y="570" text-anchor="middle" class="s">憑證只留在伺服器上，你的工具手上只有一把 Kano API key。</text>
</svg>
