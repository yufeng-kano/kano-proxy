# Static files only. Which requests reach here at all is the front router's decision.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    # llms.txt and the Markdown copies of the docs pages (docs/docs-site.md § llms.txt).
    charset_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
    types {
        text/markdown md;
    }
    include /etc/nginx/mime.types;

    # The documentation site has its own 404 page, and it must answer with a 404 status.
    error_page 404 /docs/404.html;

    # Everything except the docs and the login page is the sign-in-gated SPA, kept
    # out of search indexes. A header, not a robots.txt Disallow: a disallowed URL
    # can still be indexed from links (docs/docs-site.md § SEO and indexing).
    location /docs/ {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /login {
        try_files /index.html =404;
    }

    # The llms.txt convention puts the file at the site root; the docs build writes it.
    location = /llms.txt {
        try_files /docs/llms.txt =404;
    }

    # Build output is content-hashed and safe to cache; everything else is revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    # The SPA routes on the client, so an unknown path is its index.
    location / {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri $uri/ /index.html;
    }
}
