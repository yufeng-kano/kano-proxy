# Rust server workspace (docs/rust-server.md). The CLI keeps its own standalone
# crate and release pipeline (apps/cli, tag cli-vX.Y.Z), so it is excluded here.
[workspace]
resolver = "2"
members = ["crates/kano-proxy-core", "apps/server"]
exclude = ["apps/cli"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/yufeng-kano/kano-proxy"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
aes-gcm = "0.10"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "io-util", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
