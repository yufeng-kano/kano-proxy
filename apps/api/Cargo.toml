# The server's Rust workspace (docs/rust-server.md). It lives inside its own app, like every
# other deployable unit here, so the repository root belongs to no single language. The CLI is
# a separate app with its own crate and release pipeline (apps/cli, tag cli-vX.Y.Z).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/yufeng-kano/kano-proxy"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
dashmap = "6"
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
indexmap = { version = "2", features = ["serde"] }
mime = "0.3"
moka = { version = "0.12", features = ["future"] }
once_cell = "1"
percent-encoding = "2"
pin-project-lite = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "gzip", "multipart"] }
tiktoken-rs = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.29" # dev-only: the in-process WebSocket client the tunnel tests drive
url = "2"
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros", "multipart", "query", "json"] }
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
aes-gcm = "0.10"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "io-util", "fs", "process"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Thin LTO with the default codegen units, so the last stage compiles in parallel. The server
# spends its time waiting on upstreams and the database; fat LTO with one codegen unit bought
# no measurable speed and made a full build take several times longer.
[profile.release]
strip = true
lto = "thin"
