name = "kano-proxy"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

# Open-source defaults: placeholders only.
# Your real D1/KV ids + production APP_URL live in the gitignored
#   wrangler.production.toml
# (copy from wrangler.production.example.toml). Deploy with:
#   pnpm exec wrangler deploy --config wrangler.production.toml

[[d1_databases]]
binding = "DB"
database_name = "kano-proxy"
database_id = "local-kano-proxy-placeholder"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "BENCH"
id = "local-kano-proxy-bench-placeholder"

[[kv_namespaces]]
binding = "CACHE"
id = "local-kano-proxy-cache-placeholder"

[vars]
# Local: land on Vite admin UI after Google OAuth.
# Production: set in wrangler.production.toml (not here — this file is public).
APP_URL = "http://127.0.0.1:5173"
GOOGLE_REDIRECT_URI = "http://127.0.0.1:8787/api/auth/callback"
# Releases source for the changelog feature (public info) — forks point this at their own repo.
GITHUB_REPO = "yufeng-kano/kano-proxy"

# Optional codex egress relay (docs/codex-relay.md): set CODEX_RELAY_URL in
# wrangler.production.toml [vars] (or .dev.vars locally) and pair it with the
# CODEX_RELAY_SA_KEY secret. Both unset = relay off (codex 403s direct).

# Optional Antigravity client identity pins (docs/providers.md § Antigravity):
# ANTIGRAVITY_CLIENT_VERSION (CLI version), ANTIGRAVITY_CLIENT_BUILD (cl= build),
# ANTIGRAVITY_HUB_VERSION (onboardUser only). Unset = the pinned defaults in code.

# Secrets via .dev.vars / wrangler secret (never commit):
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SESSION_SECRET, TOKEN_ENCRYPTION_KEY
# GITHUB_TOKEN (optional — raises the GitHub rate limit from 60/hr to 5000/hr)
# CODEX_RELAY_SA_KEY (optional — GCP SA JSON for the codex relay)

# AgentTunnel Durable Object — CLI providers (docs/cli.md).
[durable_objects]
bindings = [{ name = "AGENT_TUNNEL", class_name = "AgentTunnel" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentTunnel"]

# Daily retention sweep (request_logs / sessions / oauth_login_states) — see docs/logging.md.
[triggers]
crons = ["17 3 * * *"]

# Workers Logs — the only place CPU/memory kills (error 1102) are visible:
# a killed request loses its waitUntil, so request_logs gets no row. See
# docs/deployment.md.
[observability]
enabled = true

# Per-invocation CPU ceiling — bounds runaway-billing risk. Requires Workers
# Paid; delete this block on the Free plan (deploys reject it there). See
# docs/deployment.md for how the value was sized.
[limits]
cpu_ms = 15000
