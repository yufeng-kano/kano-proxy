# kano-proxy CLI (docs/cli.md § CLI). Versioned on its own line: the tag
# `cli-vX.Y.Z` must match `version` here (docs/deployment.md).
[package]
name = "kano-proxy"
version = "2.6.0"
edition = "2021"
license = "MIT"
description = "Official kano-proxy CLI: tunnel local LLM servers in as providers, and point Claude Code or the Codex CLI at the proxy"
repository = "https://github.com/yufeng-kano/kano-proxy"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
flate2 = "1"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "io-util", "fs", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml_edit = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

# `agent launch` only: pass a stop signal on to the agent, leave a signal that was
# already ignored (nohup) ignored, and die by the signal that ended the agent.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
