# kano-proxy CLI (docs/cli.md § CLI). Version is released in lockstep with the
# product SemVer (root package.json / the vX.Y.Z tag) — bump together.
[package]
name = "kano-proxy"
version = "4.5.0"
edition = "2021"
license = "MIT"
description = "Official kano-proxy CLI: expose local LLM servers as providers over the agent tunnel"
repository = "https://github.com/yufeng-kano/kano-proxy"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
flate2 = "1"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "io-util", "fs", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
